apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: converter-service-hpa
  namespace: tutti
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: converter-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
