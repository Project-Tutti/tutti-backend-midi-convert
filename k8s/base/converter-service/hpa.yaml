apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: converter-service-hpa
  namespace: tutti
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: converter-service
  minReplicas: 1
  maxReplicas: 4   # 노드 4대 환경: 최대 활용
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
